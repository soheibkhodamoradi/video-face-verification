[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-face-verification"
version = "0.1.0"
description = "CPU-only face verification in images and videos with InsightFace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "insightface==0.7.3",
    "onnxruntime>=1.17,<2",
    "opencv-python-headless>=4.8,<5",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
evaluation = ["matplotlib>=3.7,<4", "scikit-learn>=1.3,<2"]
app = ["gradio>=4,<6"]
test = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
